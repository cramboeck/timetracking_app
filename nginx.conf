server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Einstiegsdokument NIE cachen: index.html referenziert gehashte
    # Bundles — eine veraltete Kopie zeigt nach einem Deploy auf gelöschte
    # Dateien → 404 auf /assets/index-*.js, App wirkt "down"
    location = /index.html {
        add_header Cache-Control "no-store" always;
        expires off;
    }

    # PWA-Steuerdateien immer frisch ausliefern
    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }
    location = /portal-manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Cache static assets (gehashte Dateinamen — immutable ist hier korrekt)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker
    location = /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
    }

    # Manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
