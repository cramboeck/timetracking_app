# =============================================================================
# Security-Header als Snippet (A+ SSL Rating)
# -----------------------------------------------------------------------------
# nginx-Falle: add_header wird NICHT vererbt, sobald eine Location ein
# eigenes add_header setzt (z.B. Cache-Control bei index.html/sw.js/Assets) —
# dann verliert sie ALLE Server-Level-Header inkl. CSP und HSTS. Deshalb
# liegen die Header hier als include, das im Server-Block UND in jeder
# Location mit eigenem add_header eingebunden wird.
# Gemountet via docker-compose.production.yml nach /etc/nginx/security-headers.conf
# =============================================================================

# HSTS (HTTP Strict Transport Security)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (angepasst für React + Push Notifications)
# connect-src erlaubt Push-Dienste: FCM (Chrome), Mozilla Push (Firefox), Apple Push (Safari)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://fcm.googleapis.com https://*.push.services.mozilla.com https://web.push.apple.com https://*.notify.windows.com; frame-ancestors 'self'; worker-src 'self' blob:;" always;

# Permissions Policy
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
